# Render blueprint for Skyground Video Studio.
#
# Nothing here contains a credential. Every secret is declared with
# `sync: false`, which means Render asks for it once in the dashboard and never
# reads it from Git. Applying this blueprint creates the services; it does not
# create the Cloudflare R2 bucket, which is set up separately and whose four
# values are listed in docs/DEPLOY.md.

databases:
  - name: skyground-db
    databaseName: skyground
    user: skyground
    plan: basic-256mb
    postgresMajorVersion: "16"

envVarGroups:
  # Shared by the web service and the worker so both sign and read the same way.
  - name: skyground-shared
    envVars:
      - key: SKYGROUND_ENV
        value: production
      - key: SKYGROUND_STORAGE_BACKEND
        value: s3
      - key: SKYGROUND_AUTH_MODE
        value: password
      - key: SKYGROUND_COOKIE_SECURE
        value: "true"
      # Signs session cookies and local media links. Generated once by Render.
      - key: SKYGROUND_SECRET_KEY
        generateValue: true
      # Cloudflare R2. Entered in the dashboard, never versioned.
      - key: SKYGROUND_S3_ENDPOINT
        sync: false
      - key: SKYGROUND_S3_BUCKET
        sync: false
      - key: SKYGROUND_S3_REGION
        value: auto
      - key: SKYGROUND_S3_ACCESS_KEY_ID
        sync: false
      - key: SKYGROUND_S3_SECRET_ACCESS_KEY
        sync: false

services:
  - type: web
    name: skyground-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /healthz
    # Migrations run before the new version takes traffic.
    preDeployCommand: python studio.py db upgrade
    envVars:
      - fromGroup: skyground-shared
      - key: SKYGROUND_DATABASE_URL
        fromDatabase:
          name: skyground-db
          property: connectionString
      - key: SKYGROUND_ALLOWED_ORIGINS
        sync: false

  - type: worker
    name: skyground-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    plan: standard # rendering is CPU and memory bound
    region: frankfurt
    envVars:
      - fromGroup: skyground-shared
      - key: SKYGROUND_DATABASE_URL
        fromDatabase:
          name: skyground-db
          property: connectionString
      - key: SKYGROUND_WORKER_JOB_TIMEOUT_SECONDS
        value: "3600"

  # The queue. In this phase jobs are claimed from PostgreSQL with
  # `FOR UPDATE SKIP LOCKED`, which is exactly-once and needs no broker, so this
  # instance is provisioned but not yet used: phase 3 moves fan-out and progress
  # events onto it. Remove it if you would rather add it later.
  - type: keyvalue
    name: skyground-queue
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: [] # reachable only from inside the Render network
