[project]
name = "skyground-video-studio"
version = "0.2.0"
description = "Editor collaborativo e pipeline di rendering dei video Skyground"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI declares dependencies as default arguments

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Generated by Alembic; kept as produced so a regeneration has no diff noise.
"skyground/db/migrations/versions/*" = ["E501"]
